<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nassau Suffolk Address</title>
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #2f3337;
    }

    .address-widget {
      position: relative;
      width: 100%;
      max-width: 100%;
    }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: #3f4750;
    }

    input {
      width: 100%;
      height: 42px;
      border: 1px solid #b8c0cc;
      border-radius: 4px;
      padding: 9px 11px;
      font-size: 16px;
      line-height: 22px;
      color: #20262d;
      background: #fff;
      outline: none;
    }

    input:focus {
      border-color: #4c8bf5;
      box-shadow: 0 0 0 2px rgba(76, 139, 245, 0.18);
    }

    .status {
      min-height: 18px;
      margin-top: 5px;
      font-size: 12px;
      line-height: 18px;
      color: #68717c;
    }

    .status.error {
      color: #b3261e;
      font-weight: 600;
    }

    .suggestions {
      position: static;
      z-index: 20;
      display: none;
      margin: 6px 0 0;
      padding: 4px 0;
      list-style: none;
      border: 1px solid #c5ccd6;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 8px 18px rgba(32, 38, 45, 0.18);
    }

    .suggestions.visible {
      display: block;
    }

    .suggestions button {
      width: 100%;
      min-height: 38px;
      border: 0;
      padding: 8px 11px;
      font: inherit;
      font-size: 14px;
      line-height: 20px;
      text-align: left;
      color: #20262d;
      background: transparent;
      cursor: pointer;
    }

    .suggestions button:hover,
    .suggestions button:focus {
      background: #eef4ff;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="address-widget">
    <label for="addressInput">Service address</label>
    <input id="addressInput" type="text" autocomplete="off" placeholder="Search Nassau or Suffolk address">
    <ul id="suggestions" class="suggestions" role="listbox"></ul>
    <div id="status" class="status" aria-live="polite"></div>
    <div id="placesHost" hidden></div>
  </div>

  <script>
    const SERVICE_AREA_ZIP_PATTERN = /^(?:110(?!04|05)\d{2}|115\d{2}|117\d{2}|118\d{2}|119\d{2})(?:-\d{4})?$/;
    const SERVICE_AREA_LOCALITIES = new Set([
      'AMAGANSETT', 'AMITYVILLE', 'AQUEBOGUE', 'ASHAROKEN', 'ATLANTIC BEACH',
      'BABYLON', 'BALDWIN', 'BAY SHORE', 'BAYPORT', 'BAYVILLE', 'BELLEROSE',
      'BELLEROSE VILLAGE', 'BELLMORE', 'BELLPORT', 'BETHPAGE', 'BLUE POINT',
      'BOHEMIA', 'BRENTWOOD', 'BRIDGEHAMPTON', 'BRIGHTWATERS', 'BROOKHAVEN',
      'CALVERTON', 'CARLE PLACE', 'CENTER MORICHES', 'CENTERPORT', 'CENTEREACH',
      'CENTRAL ISLIP', 'COLD SPRING HARBOR', 'COMMACK', 'COPIAGUE', 'CORAM',
      'CUTCHOGUE', 'DEER PARK', 'DIX HILLS', 'EAST ATLANTIC BEACH', 'EAST FARMINGDALE',
      'EAST HAMPTON', 'EAST ISLIP', 'EAST MARION', 'EAST MEADOW', 'EAST MORICHES',
      'EAST NORTHPORT', 'EAST NORWICH', 'EAST PATCHOGUE', 'EAST QUOGUE', 'EAST ROCKAWAY',
      'EAST SETAUKET', 'EASTPORT', 'ELMONT', 'FARMINGDALE', 'FISHERS ISLAND',
      'FLANDERS', 'FLORAL PARK', 'FORT SALONGA', 'FRANKLIN SQUARE', 'FREEPORT',
      'GARDEN CITY', 'GILGO-OAK BEACH-CAPTREE', 'GLEN COVE', 'GLEN HEAD', 'GLENWOOD LANDING',
      'GREAT NECK', 'GREAT RIVER', 'GREENLAWN', 'GREENPORT', 'GREENVALE',
      'HAMPTON BAYS', 'HAUPPAUGE', 'HEMPSTEAD', 'HEWLETT', 'HICKSVILLE',
      'HOLBROOK', 'HOLTSVILLE', 'HUNTINGTON', 'HUNTINGTON STATION', 'INWOOD',
      'ISLAND PARK', 'ISLANDIA', 'ISLIP', 'ISLIP TERRACE', 'JAMESPORT',
      'JERICHO', 'KINGS PARK', 'LAKE GROVE', 'LAKE RONKONKOMA', 'LAUREL',
      'LAWRENCE', 'LEVITTOWN', 'LINDENHURST', 'LOCUST VALLEY', 'LONG BEACH',
      'LYNBROOK', 'MANHASSET', 'MANORVILLE', 'MASTIC', 'MASTIC BEACH',
      'MATTITUCK', 'MEDFORD', 'MELVILLE', 'MERRICK', 'MILLER PLACE',
      'MINEOLA', 'MONTAUK', 'MORICHES', 'MOUNT SINAI', 'NAPEAGUE',
      'NESCONSET', 'NEW HYDE PARK', 'NORTH BABYLON', 'NORTH BELLMORE', 'NORTH HEMPSTEAD',
      'NORTH MASSAPEQUA', 'NORTH MERRICK', 'NORTHPORT', 'OAKDALE', 'OCEANSIDE',
      'OLD BETHPAGE', 'OLD WESTBURY', 'OYSTER BAY', 'PATCHOGUE', 'PECONIC',
      'PLAINVIEW', 'POINT LOOKOUT', 'PORT JEFFERSON', 'PORT JEFFERSON STATION', 'PORT WASHINGTON',
      'QUOGUE', 'REMSENBURG-SPEONK', 'RIVERHEAD', 'ROCKVILLE CENTRE', 'ROCKY POINT',
      'RONKONKOMA', 'ROOSEVELT', 'ROSLYN', 'SAG HARBOR', 'SAGAPONACK',
      'SAINT JAMES', 'SANDS POINT', 'SAYVILLE', 'SEA CLIFF', 'SEAFORD',
      'SELDEN', 'SETAUKET-EAST SETAUKET', 'SHELTER ISLAND', 'SHIRLEY', 'SHOREHAM',
      'SMITHTOWN', 'SOUTH JAMESPORT', 'SOUTHAMPTON', 'SOUTHOLD', 'SPEONK',
      'ST JAMES', 'STONY BROOK', 'SYOSSET', 'UNIONDALE', 'UPPER BROOKVILLE',
      'VALLEY STREAM', 'WADING RIVER', 'WAINSCOTT', 'WANTAGH', 'WATER MILL',
      'WEST BABYLON', 'WEST HAMPTON DUNES', 'WEST HEMPSTEAD', 'WEST ISLIP', 'WEST SAYVILLE',
      'WESTBURY', 'WESTHAMPTON', 'WESTHAMPTON BEACH', 'WYANDANCH', 'YAPHANK'
    ]);
    const SOUTHWEST = { lat: 40.5300, lng: -74.1000 };
    const NORTHEAST = { lat: 41.1700, lng: -71.7000 };
    const MAX_VISIBLE_SUGGESTIONS = 5;
    const MIN_SEARCH_CHARS = 2;
    const DEBOUNCE_MS = 60;
    const COLLAPSED_FRAME_HEIGHT = 88;
    const EXPANDED_FRAME_HEIGHT = 320;

    const input = document.getElementById('addressInput');
    const suggestions = document.getElementById('suggestions');
    const statusEl = document.getElementById('status');
    const placesHost = document.getElementById('placesHost');

    let autocompleteService = null;
    let placesService = null;
    let selectedValue = '';
    let pendingTimer = 0;
    let requestSerial = 0;

    function widgetSetting(name) {
      if (window.JFCustomWidget && typeof JFCustomWidget.getWidgetSetting === 'function') {
        const value = JFCustomWidget.getWidgetSetting(name);
        if (value) {
          return value;
        }
      }
      return new URLSearchParams(window.location.search).get(name) || '';
    }

    function setStatus(message, isError) {
      statusEl.textContent = message || '';
      statusEl.classList.toggle('error', Boolean(isError));
      resizeFrame();
    }

    function resizeFrame() {
      if (window.JFCustomWidget && typeof JFCustomWidget.requestFrameResize === 'function') {
        const isExpanded = suggestions.classList.contains('visible');
        JFCustomWidget.requestFrameResize({
          height: isExpanded ? EXPANDED_FRAME_HEIGHT : COLLAPSED_FRAME_HEIGHT
        });
      }
    }

    function formattedComponent(place, type, useShortName) {
      const components = place.address_components || [];
      const component = components.find(item => item.types && item.types.includes(type));
      if (!component) {
        return '';
      }
      return useShortName ? component.short_name : component.long_name;
    }

    function streetAddress(place) {
      const number = formattedComponent(place, 'street_number', false);
      const route = formattedComponent(place, 'route', false);
      if (!number || !route) {
        return '';
      }
      return [number, route].filter(Boolean).join(' ').trim();
    }

    function placeToAddress(place) {
      const street = streetAddress(place);
      const city = formattedComponent(place, 'locality', false)
        || formattedComponent(place, 'postal_town', false)
        || formattedComponent(place, 'sublocality', false);
      const state = formattedComponent(place, 'administrative_area_level_1', true);
      const postal = formattedComponent(place, 'postal_code', false);
      if (!street || !city || state !== 'NY' || !SERVICE_AREA_ZIP_PATTERN.test(postal)) {
        return null;
      }
      return {
        display: place.formatted_address || [street, city, state, postal].filter(Boolean).join(', '),
        value: [
          `Street Address: ${street}`,
          `City: ${city}`,
          `State / Province: ${state}`,
          `Postal / Zip Code: ${postal}`
        ].join('\n')
      };
    }

    function sendValue(value, valid) {
      if (window.JFCustomWidget && typeof JFCustomWidget.sendData === 'function') {
        JFCustomWidget.sendData({ valid: Boolean(valid), value: value || '' });
      }
    }

    function clearSuggestions() {
      suggestions.innerHTML = '';
      suggestions.classList.remove('visible');
      resizeFrame();
    }

    function renderSuggestions(items) {
      suggestions.innerHTML = '';
      items.forEach(appendSuggestion);
      suggestions.classList.toggle('visible', items.length > 0);
      resizeFrame();
    }

    function appendSuggestion(item) {
      const li = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = item.display;
      button.addEventListener('click', () => selectPrediction(item));
      li.appendChild(button);
      suggestions.appendChild(li);
      suggestions.classList.add('visible');
      resizeFrame();
    }

    function predictionLooksLikeStreetAddress(prediction) {
      return /^\d+\s+\S+/.test(prediction.description || '');
    }

    function localityFromPrediction(prediction) {
      const secondary = prediction.structured_formatting && prediction.structured_formatting.secondary_text
        ? prediction.structured_formatting.secondary_text
        : prediction.description || '';
      const parts = secondary.split(',').map(part => part.trim().toUpperCase()).filter(Boolean);
      const nyIndex = parts.indexOf('NY');
      if (nyIndex > 0) {
        return parts[nyIndex - 1];
      }
      const descriptionParts = (prediction.description || '').split(',').map(part => part.trim().toUpperCase()).filter(Boolean);
      const descriptionNyIndex = descriptionParts.indexOf('NY');
      return descriptionNyIndex > 0 ? descriptionParts[descriptionNyIndex - 1] : '';
    }

    function predictionLooksInServiceArea(prediction) {
      return predictionLooksLikeStreetAddress(prediction)
        && SERVICE_AREA_LOCALITIES.has(localityFromPrediction(prediction));
    }

    function detailForPlaceId(placeId) {
      return new Promise(resolve => {
        placesService.getDetails({
          placeId,
          fields: ['address_components', 'formatted_address', 'geometry']
        }, (place, status) => {
          if (status !== google.maps.places.PlacesServiceStatus.OK || !place) {
            resolve(null);
            return;
          }
          resolve(placeToAddress(place));
        });
      });
    }

    function selectPrediction(item) {
      selectedValue = '';
      sendValue('', false);
      input.value = item.display;
      clearSuggestions();
      setStatus('Verifying address...', false);
      detailForPlaceId(item.placeId).then(address => {
        if (!address) {
          setStatus('Select a full Nassau or Suffolk address.', true);
          return;
        }
        selectedValue = address.value;
        input.value = address.display;
        setStatus('', false);
        sendValue(selectedValue, true);
      });
    }

    function searchAddresses(query, serial) {
      const serviceBounds = new google.maps.LatLngBounds(SOUTHWEST, NORTHEAST);
      autocompleteService.getPlacePredictions({
        input: query,
        types: ['address'],
        bounds: serviceBounds,
        locationRestriction: serviceBounds,
        strictBounds: true,
        componentRestrictions: { country: 'us' }
      }, (predictions, status) => {
        if (serial !== requestSerial) {
          return;
        }
        if (status !== google.maps.places.PlacesServiceStatus.OK || !predictions || predictions.length === 0) {
          clearSuggestions();
          setStatus('No Nassau or Suffolk address matches found.', false);
          return;
        }
        const seenDisplays = new Set();
        const items = [];
        predictions.forEach(prediction => {
          if (!predictionLooksInServiceArea(prediction) || seenDisplays.has(prediction.description)) {
            return;
          }
          seenDisplays.add(prediction.description);
          items.push({ display: prediction.description, placeId: prediction.place_id });
        });
        renderSuggestions(items.slice(0, MAX_VISIBLE_SUGGESTIONS));
        setStatus(items.length ? '' : 'No Nassau or Suffolk address matches found.', false);
      });
    }

    function scheduleSearch() {
      selectedValue = '';
      sendValue('', false);
      clearTimeout(pendingTimer);
      const query = input.value.trim();
      if (query.length < MIN_SEARCH_CHARS) {
        clearSuggestions();
        setStatus('', false);
        return;
      }
      setStatus('Searching...', false);
      const serial = ++requestSerial;
      pendingTimer = window.setTimeout(() => searchAddresses(query, serial), DEBOUNCE_MS);
    }

    function loadGooglePlaces(apiKey) {
      return new Promise((resolve, reject) => {
        window.__heaAddressInit = resolve;
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&libraries=places&callback=__heaAddressInit`;
        script.async = true;
        script.onerror = () => reject(new Error('Google Places failed to load.'));
        document.head.appendChild(script);
      });
    }

    function initializeWidget() {
      const apiKey = widgetSetting('apiKey');
      const initialValue = widgetSetting('value') || '';
      if (initialValue) {
        selectedValue = initialValue;
        input.value = initialValue.split('\n')[0].replace(/^Street Address:\s*/, '');
      }
      if (!apiKey) {
        setStatus('Google Maps API key is missing.', true);
        return;
      }
      loadGooglePlaces(apiKey)
        .then(() => {
          autocompleteService = new google.maps.places.AutocompleteService();
          placesService = new google.maps.places.PlacesService(placesHost);
          input.addEventListener('input', scheduleSearch);
          input.addEventListener('blur', () => window.setTimeout(clearSuggestions, 180));
          sendValue(selectedValue, Boolean(selectedValue));
          resizeFrame();
        })
        .catch(error => setStatus(error.message, true));
    }

    if (window.JFCustomWidget && typeof JFCustomWidget.subscribe === 'function') {
      JFCustomWidget.subscribe('ready', initializeWidget);
      JFCustomWidget.subscribe('submit', () => {
        JFCustomWidget.sendSubmit({
          valid: Boolean(selectedValue),
          value: selectedValue
        });
      });
    } else {
      initializeWidget();
    }
  </script>
</body>
</html>
